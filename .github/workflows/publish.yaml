name: Publish

on:
  release:
    types: [created]

jobs:

  publish-github:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          ref: ${{ github.ref }}
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: 25

      - name: Check
        uses: eskatos/gradle-command-action@v1
        with:
          arguments: check

      - name: Build
        uses: eskatos/gradle-command-action@v1
        with:
          arguments: build

      - name: Upload Java Jars
        id: upload-java-asset
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: ./emerald-api/build/libs/*.jar
          file_glob: true

      - name: Upload Kotlin Jars
        id: upload-kotlin-asset
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: ./emerald-api-kotlin/build/libs/*.jar
          file_glob: true

  publish-gcp-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          ref: ${{ github.ref }}
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: 25

      - name: Check
        uses: eskatos/gradle-command-action@v1
        with:
          arguments: check

      # Exports GOOGLE_APPLICATION_CREDENTIALS, which the Artifact Registry Gradle plugin picks up (no gcloud CLI needed)
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_ARTIFACTS_KEY }}

      - name: Upload to GCP
        uses: eskatos/gradle-command-action@v1
        with:
          arguments: publish
        env:
          ENABLE_GCP: true
